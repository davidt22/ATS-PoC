framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'

        default_bus: command.bus

        buses:
            command.bus: []
            query.bus: []
            event.bus:
                default_middleware:
                    allow_no_handlers: true

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Domain events dispatched via App\Shared\Application\Bus\EventBus.
            # ApplicationSubmitted triggers the async AI enrichment worker
            # (see EnrichApplicationOnApplicationSubmitted); run it with
            # `bin/console messenger:consume async`.
            App\Recruitment\Domain\Event\ApplicationSubmitted: async
