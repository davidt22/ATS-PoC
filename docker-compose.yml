services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viterbit_php
    volumes:
      - .:/var/www/html
    depends_on:
      - database
    networks:
      - viterbit_net

  nginx:
    image: nginx:alpine
    container_name: viterbit_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - viterbit_net

  database:
    image: mysql:8.0
    container_name: viterbit_db
    environment:
      MYSQL_DATABASE: viterbit
      MYSQL_USER: app
      MYSQL_PASSWORD: "!ChangeMe!"
      MYSQL_ROOT_PASSWORD: "!ChangeMeRoot!"
    ports:
      - "3306:3306"
    volumes:
      - viterbit_db_data:/var/lib/mysql
    networks:
      - viterbit_net

  adminer:
    image: adminer
    container_name: viterbit_adminer
    ports:
      - "8081:8080"
    depends_on:
      - database
    networks:
      - viterbit_net

networks:
  viterbit_net:

volumes:
  viterbit_db_data:
